name: HAPI conformance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hapi:
    name: HAPI unit tests and compliance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"

      - name: Install
        # Dependencies only, from wheels: the code under test is run from the checkout.
        run: uv sync --locked --extra dev --no-build --no-install-project

      - name: Unit tests
        # Offline: no provider is contacted (importing speasy_proxy would otherwise fetch every inventory).
        env:
          SPEASY_CORE_DISABLED_PROVIDERS: amda,cda,csa,ssc,cdpp3dview,archive,uiowaephtool
          SPEASY_PROXY_ENABLED: "false"
        run: uv run --no-sync --no-build python -m pytest speasy_proxy/hapi -q

      - name: Cache the HAPI verifier
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/speasy-proxy
          key: hapi-verifier-${{ hashFiles('tests/hapi_conformance/run.sh') }}

      - name: Verifier and client checks
        run: tests/hapi_conformance/run.sh
