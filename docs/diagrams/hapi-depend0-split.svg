  <text class="title" x="445" y="191">b_hr</text>
  <text class="muted code" x="445" y="210">DEPEND_0 = epoch_hr</text>

  <rect class="epoch" x="660" y="24" width="320" height="96" rx="12"/>
  <text class="title" x="820" y="52">HAPI dataset</text>
  <text class="code" x="820" y="78">archive/my_mission/fgm/fgm_l2@0</text>
  <text class="muted" x="820" y="102">Time · b_gse · b_total</text>
  <rect class="epoch-hr" x="660" y="148" width="320" height="96" rx="12"/>
  <text class="title" x="820" y="176">HAPI dataset</text>
  <text class="code" x="820" y="202">archive/my_mission/fgm/fgm_l2@1</text>
  <text class="muted" x="820" y="226">Time · b_hr</text>

  <path class="arrow" d="M240 130 C 285 130, 285 65, 328 65"/>
