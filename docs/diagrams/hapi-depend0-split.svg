<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; text-anchor: middle; font-size: 13px; }
    .title { font-size: 15px; font-weight: 600; }
    .muted { fill: #64748b; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .user { fill: #f8fafc; stroke: #cbd5e1; }
    .epoch { fill: #eef2ff; stroke: #6b8afd; }
    .epoch-hr { fill: #fff7ed; stroke: #f59e0b; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.6; marker-end: url(#head); }
    .head { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .muted { fill: #94a3b8; }
      .user { fill: #1e293b; stroke: #475569; }
      .epoch { fill: #1e2547; stroke: #6b8afd; }
      .epoch-hr { fill: #2d1f0a; stroke: #f59e0b; }
      .arrow { stroke: #64748b; }
      .head { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>

  <rect class="user" x="20" y="82" width="220" height="96" rx="12"/>
