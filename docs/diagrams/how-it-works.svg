<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; text-anchor: middle; font-size: 13px; }
    .title { font-size: 15px; font-weight: 600; }
    .muted { fill: #64748b; }
    .label { fill: #64748b; font-size: 12px; }
    .group-label { fill: #4f6bd8; font-size: 13px; font-weight: 600; text-anchor: start; }
    .user { fill: #f8fafc; stroke: #cbd5e1; }
    .proxy { fill: #eef2ff; stroke: #6b8afd; }
    .data { fill: #ecfdf5; stroke: #10b981; }
    .group { fill: #6b8afd; fill-opacity: 0.05; stroke: #6b8afd; stroke-dasharray: 5 4; }
    .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.6; marker-end: url(#head); }
    .head { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .muted, .label { fill: #94a3b8; }
      .group-label { fill: #8fa6ff; }
      .user { fill: #1e293b; stroke: #475569; }
      .proxy { fill: #1e2547; stroke: #6b8afd; }
      .data { fill: #0f2a24; stroke: #34d399; }
      .group { fill-opacity: 0.08; }
      .arrow { stroke: #64748b; }
      .head { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>

  <rect class="user" x="20" y="34" width="190" height="84" rx="12"/>
  <text class="title" x="115" y="68">Your speasy</text>
  <text class="muted" x="115" y="90">with its local cache</text>

  <rect class="user" x="20" y="150" width="190" height="96" rx="12"/>
  <text class="title" x="115" y="180">Any HTTP client</text>
  <text class="muted" x="115" y="202">curl · JS · Julia · IDL</text>
  <text class="muted" x="115" y="222">HAPI clients · browser</text>

  <rect class="group" x="340" y="12" width="430" height="246" rx="16"/>
  <text class="group-label" x="358" y="36">speasy-proxy</text>

  <rect class="proxy" x="360" y="52" width="170" height="186" rx="12"/>
  <text class="title" x="445" y="84">HTTP API</text>
  <text class="muted" x="445" y="116">/get_data</text>
  <text class="muted" x="445" y="140">/get_inventory</text>
  <text class="muted" x="445" y="164">/hapi</text>
  <text class="muted" x="445" y="188">/plot</text>

  <rect class="proxy" x="580" y="90" width="170" height="110" rx="12"/>
  <text class="title" x="665" y="124">speasy</text>
  <text class="muted" x="665" y="148">shared cache:</text>
  <text class="muted" x="665" y="168">one fetch serves all</text>

  <rect class="data" x="850" y="52" width="170" height="186" rx="12"/>
  <text class="title" x="935" y="84">Data providers</text>
  <text class="muted" x="935" y="116">AMDA · CDAWeb</text>
  <text class="muted" x="935" y="140">CSA · SSCWeb</text>
  <text class="muted" x="935" y="164">3DView</text>
  <text class="muted" x="935" y="188">your archives</text>

  <path class="arrow" d="M210 76 C 285 76, 285 112, 358 112"/>
  <text class="label" x="276" y="70">pickle</text>
  <path class="arrow" d="M210 198 C 285 198, 285 172, 358 172"/>
  <text class="label" x="276" y="222">JSON · CDF · HAPI</text>
  <path class="arrow" d="M530 145 L 578 145"/>
  <path class="arrow" d="M750 145 L 848 145"/>
  <text class="label" x="800" y="135">fetch</text>
</svg>
